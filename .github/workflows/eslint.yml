name: eslint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eslint:
    name: eslint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Composite action: oven-sh/setup-bun + bun install
      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Report-only until the baseline is triaged: findings do not fail the check.
      - name: Run eslint
        continue-on-error: true
        run: bun script/eslint.ts eslint-report.json 2>&1 | tee eslint.log

      - name: Upload eslint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eslint-report
          path: |
            eslint-report.json
            eslint.log
          if-no-files-found: warn
